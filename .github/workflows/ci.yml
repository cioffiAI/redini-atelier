# CI — unit tests + production build.
# Browser E2E (scripts/atelier-e2e.mjs) requires Chrome 149+ launched with the
# WebMCP flag (--enable-features=WebMCP) and runs outside CI: it drives the real
# WebMCP tool path behind an experimental flag that tracks Chrome's release
# channel, so wiring it to a hosted runner would buy a red badge that tracks
# Chrome rather than this repo. It stays a local gate — see README "How to run".
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `npm run build` is `tsc && vite build`, so this covers type checking too.
      - run: npm test
      - run: npm run build
      # Backs the README/design-doc claim: the deploy headers ship verbatim in
      # dist/ (Vite copies public/_headers) — fail the build if they drift.
      - run: grep -q "Origin-Agent-Cluster" dist/_headers
